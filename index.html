<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIF STORE - Engineering Industries Factory</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Keep your existing CSS here - same as before */
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .card { background: #fff; color: #000; border-radius: 12px; padding: 20px; max-width: 500px; margin: 0 auto; }
        .btn-success { width: 100%; padding: 14px; background: #28a745; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .import-section { border: 2px dashed #ccc; padding: 16px; margin: 12px 0; border-radius: 10px; }
        .msg-success { color: green; font-weight: 600; }
        .msg-error { color: red; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <h2>📥 Import Opening Stock</h2>
    
    <div class="form-group">
        <label>Select Store *</label>
        <select id="importStore">
            <option value="Store 1">Store 1</option>
            <option value="Store 2">Store 2</option>
            <option value="Store 3">Store 3</option>
        </select>
    </div>

    <div class="import-section">
        <h3>📁 Upload Excel File (.xlsx)</h3>
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
        <button class="btn-success" id="uploadBtn" onclick="importFromFile()">📤 IMPORT FILE</button>
    </div>
    
    <div id="importMsg" style="margin-top:12px;"></div>
</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbzUi95ElenX579FYcz8CGkwgNIF870QDuMUwYb8L0Vne3ktKpaK-Dz4pnvwgsrKc58WBQ/exec';

async function importFromFile() {
    const fileInput = document.getElementById('excelFile');
    const file = fileInput.files[0];
    const msgDiv = document.getElementById('importMsg');
    const btn = document.getElementById('uploadBtn');

    if (!file) return alert('Please select a file');
    
    btn.textContent = '⏳ Reading Excel file...';
    btn.disabled = true;
    msgDiv.innerHTML = '';

    try {
        const store = document.getElementById('importStore').value;
        
        // Read Excel file properly using SheetJS
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 }); // raw rows

        console.log("Total rows in Excel:", jsonData.length);

        const items = [];
        
        for (let i = 0; i < jsonData.length; i++) {
            const row = jsonData[i];
            if (!row || row.length < 2) continue;
            
            // Skip header row
            if (i === 0 && (String(row[0]).toLowerCase().includes('item') || String(row[0]).toLowerCase().includes('name'))) continue;
            
            // Column D = Item Name (index 3), Column E = Quantity (index 4)
            const itemName = String(row[3] || '').trim();   // Column D
            const qty = parseFloat(row[4]);                 // Column E
            
            if (itemName && !isNaN(qty)) {
                items.push({ store: store, itemName: itemName, qty: qty });
            }
        }

        console.log("Valid items found:", items.length);

        if (items.length === 0) {
            msgDiv.innerHTML = '<div class="msg-error">❌ No valid items found in the file</div>';
            btn.textContent = '📤 IMPORT FILE';
            btn.disabled = false;
            return;
        }

        btn.textContent = '⏳ Sending ' + items.length + ' items...';

        const response = await fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'importOpening', items: items })
        });

        const result = await response.json();

        if (result.status === 'success') {
            msgDiv.innerHTML = `<div class="msg-success">✅ Successfully imported <strong>${result.imported}</strong> items!</div>`;
            fileInput.value = '';
        } else {
            msgDiv.innerHTML = `<div class="msg-error">❌ ${result.message}</div>`;
        }

    } catch (e) {
        console.error(e);
        msgDiv.innerHTML = `<div class="msg-error">❌ Error: ${e.message}</div>`;
    } finally {
        btn.textContent = '📤 IMPORT FILE';
        btn.disabled = false;
    }
}
</script>
</body>
</html>
