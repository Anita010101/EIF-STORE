<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>ENGINEERING INDUSTRIES FACTORY - Inventory</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .row { margin: 10px 0; }
    input, select { padding: 8px; width: 280px; }
    button { padding: 10px 14px; cursor: pointer; }
    .box { border: 1px solid #ddd; padding: 14px; max-width: 980px; }
    .small { font-size: 12px; color: #666; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
  </style>
</head>
<body>
  <h2>Inventory Web App</h2>

  <div class="box" id="loginBox">
    <h3>Login</h3>
    <div class="row">
      <label>Mode</label><br/>
      <select id="mode">
        <option value="STORE">Store</option>
        <option value="MASTER">Master</option>
      </select>
    </div>

    <div class="row" id="storeRow">
      <label>Store</label><br/>
      <select id="store">
        <option value="Store1">Store1</option>
        <option value="Store2">Store2</option>
        <option value="Store3">Store3</option>
      </select>
    </div>

    <div class="row">
      <label>Password</label><br/>
      <input id="password" type="password"/>
    </div>

    <button onclick="login()">Login</button>
    <div class="small" id="loginMsg"></div>
  </div>

  <div class="box" id="appBox" style="display:none;">
    <div class="row">
      <strong>Current Stock (auto-calculated)</strong>
      <button style="float:right;" onclick="loadStock()">Refresh</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ITEM NAME</th>
          <th>BALANCE</th>
        </tr>
      </thead>
      <tbody id="stockTbody"></tbody>
    </table>

    <hr/>

    <h3>Add Items (store transaction)</h3>
    <div class="row">
      <label>Item Name (exact match)</label><br/>
      <input id="itemName"/>
    </div>
    <div class="row">
      <label>Barcode (optional)</label><br/>
      <input id="barcode"/>
    </div>
    <div class="row">
      <label>Quantity</label><br/>
      <input id="quantity" type="number"/>
    </div>
    <div class="row">
      <label>DC No.</label><br/>
      <input id="dcNo"/>
    </div>
    <div class="row">
      <label>Date</label><br/>
      <input id="txDate" type="date"/>
    </div>
    <button onclick="addItems()">Add</button>

    <div class="small" id="txMsg"></div>

    <hr/>

    <h3>Upload Excel → Import into Opening Stock</h3>
    <div class="row">
      <label>Upload file to Google Drive first</label><br/>
      <input id="fileId" placeholder="Paste Drive fileId here"/>
    </div>
    <button onclick="uploadOpening()">Import</button>
    <div class="small" id="uploadMsg"></div>
  </div>

<script>
  // CHANGE THIS:
  const API_URL = "https://script.google.com/macros/s/AKfycbwEEFoxBX72Y41sGIb0EQdKPfQ1LeWJy13rcT3bAwl3oLRUHw_IeYBSb-IHgOf_CV0O9g/exec";

  let token = null;
  let role = null;

  function apiPost(payload) {
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

  document.getElementById("mode").addEventListener("change", (e) => {
    const v = e.target.value;
    document.getElementById("storeRow").style.display = (v === "STORE") ? "block" : "none";
  });

  async function login() {
    const mode = document.getElementById("mode").value;
    const store = document.getElementById("store").value;
    const password = document.getElementById("password").value;

    const payload = {
      action: "login",
      master: (mode === "MASTER"),
      store: mode === "MASTER" ? "MASTER" : store,
      password
    };

    const res = await apiPost(payload);
    if (!res.ok) {
      document.getElementById("loginMsg").innerText = res.error || "Login failed";
      return;
    }
    token = res.token;
    role = res.role;

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
    document.getElementById("loginMsg").innerText = "";
    document.getElementById("txDate").value = new Date().toISOString().slice(0,10);
    loadStock();
  }

  async function loadStock() {
    const res = await apiPost({ action: "loadStock", token });
    if (!res.ok) return alert(res.error || "Failed");
    const tbody = document.getElementById("stockTbody");
    tbody.innerHTML = "";
    for (const it of res.items || []) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${escapeHtml(it.itemName)}</td><td>${it.balance}</td>`;
      tbody.appendChild(tr);
    }
  }

  async function addItems() {
    const itemName = document.getElementById("itemName").value.trim();
    const barcode = document.getElementById("barcode").value.trim();
    const qty = Number(document.getElementById("quantity").value);
    const dcNo = document.getElementById("dcNo").value.trim();
    const date = document.getElementById("txDate").value;

    // For master, user can pass store via a separate input in UI (not implemented here).
    const payload = {
      action: "addItems",
      token,
      itemName,
      barcode,
      quantity: qty,
      dcNo,
      date
    };

    const res = await apiPost(payload);
    if (!res.ok) {
      document.getElementById("txMsg").innerText = res.error || "Failed";
      return;
    }
    document.getElementById("txMsg").innerText = `Saved. New balance for "${res.itemName}" = ${res.balance}`;
    await loadStock();
  }

  async function uploadOpening() {
    const fileId = document.getElementById("fileId").value.trim();
    const res = await apiPost({ action: "uploadExcelToOpening", token, fileId });
    document.getElementById("uploadMsg").innerText = res.ok ? `Imported: ${res.imported || 0}` : (res.error || "Failed");
    await loadStock();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
  }
</script>
</body>
</html>
